services:
  text-analyzer:
    build: 
      context: ./text-analyzer
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - GIGACHAT_AUTH_BASE64=${GIGACHAT_AUTH_BASE64}
    restart: unless-stopped
    networks:
      - app-network

  image-analyzer:
    build:
      context: ./image-analyzer
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - YANDEX_VISION_API_KEY=${YANDEX_VISION_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - GIGACHAT_AUTH_BASE64=${GIGACHAT_AUTH_BASE64}
    restart: unless-stopped
    networks:
      - app-network

  speech-to-text:
    build:
      context: ./speech-to-text
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  ollama_data:

networks:
  app-network:
    driver: bridge