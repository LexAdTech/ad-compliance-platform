services:
  text-analyzer:
    build: 
      context: ./text-analyzer
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
    environment:
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - app-network

  image-analyzer:
    build:
      context: ./image-analyzer
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - app-network

  speech-to-text:
    build:
      context: ./speech-to-text
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  ollama_data:

networks:
  app-network:
    driver: bridge